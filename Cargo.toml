[package]
name = "pdf-wizard"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
crossbeam-channel = "0.5.17"
hayro = "0.9.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
lopdf = "0.47.0"

[profile.release]
lto = true
opt-level = 3
strip = true
codegen-units = 1
