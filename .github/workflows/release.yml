name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: pdf-wizard-linux
            bin: pdf-wizard
          - os: macos-latest
            artifact: pdf-wizard-macos
            bin: pdf-wizard
          - os: windows-latest
            artifact: pdf-wizard-windows
            bin: pdf-wizard.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/release/${{ matrix.bin }}

