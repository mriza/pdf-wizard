name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: pdf-wizard-linux
            bin: pdf-wizard
            asset: pdf-wizard-linux.tar.gz
            archive: true
          - os: macos-latest
            artifact: pdf-wizard-macos
            bin: pdf-wizard
            asset: pdf-wizard-macos.tar.gz
            archive: true
          - os: windows-latest
            artifact: pdf-wizard-windows
            bin: pdf-wizard.exe
            asset: pdf-wizard-windows.exe
            archive: false
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release
      - shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.archive }}" = "true" ]; then
            tar -C target/release -czf "dist/${{ matrix.asset }}" "${{ matrix.bin }}"
          else
            cp "target/release/${{ matrix.bin }}" "dist/${{ matrix.asset }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

